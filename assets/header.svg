<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Dhruv Patel - Full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="260" rx="16"/></clipPath>

    <clipPath id="c0"><rect x="0" y="0" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;380;380;0;0" keyTimes="0;0.1;0.27;0.3333;1"/></rect></clipPath>
    <clipPath id="c1"><rect x="0" y="0" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;420;420;0;0" keyTimes="0;0.3333;0.4333;0.6;0.6667;1"/></rect></clipPath>
    <clipPath id="c2"><rect x="0" y="0" height="40" width="0">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;400;400;0" keyTimes="0;0.6667;0.7667;0.9367;1"/></rect></clipPath>
  </defs>

  <style>
    .name { font: 800 62px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#accent); }
    .hi   { font: 500 20px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #94a3b8; }
    .role { font: 500 26px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #e2e8f0; }
    .prompt { font: 700 26px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #38bdf8; }
    .sub  { font: 400 15px ui-monospace, 'Cascadia Code', Consolas, monospace; fill: #64748b; }
    .fade { animation: rise 1.1s ease-out both; }
    .d2 { animation-delay: .25s; } .d3 { animation-delay: .5s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1s steps(2, start) infinite; fill: #38bdf8; }
    @keyframes blink { to { visibility: hidden; } }
    .float { animation: bob 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .f2 { animation-duration: 8s; animation-delay: -2s; } .f3 { animation-duration: 7s; animation-delay: -4s; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-16px) rotate(3deg); } }
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    .o2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(60px,24px); } }
    .scan { animation: sweep 5s linear infinite; }
    @keyframes sweep { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#grid)"/>

    <circle class="orb" cx="800" cy="70" r="110" fill="#818cf8" fill-opacity="0.12"/>
    <circle class="orb o2" cx="180" cy="230" r="90" fill="#38bdf8" fill-opacity="0.10"/>

    <text class="float" x="835" y="95" font-family="ui-monospace, Consolas, monospace" font-size="54" font-weight="700" fill="#38bdf8" fill-opacity="0.55">&lt;/&gt;</text>
    <text class="float f2" x="905" y="190" font-family="ui-monospace, Consolas, monospace" font-size="34" font-weight="700" fill="#e879f9" fill-opacity="0.5">{ }</text>
    <text class="float f3" x="760" y="205" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="700" fill="#818cf8" fill-opacity="0.5">[ ]</text>

    <rect class="scan" x="0" y="0" width="120" height="260" fill="#ffffff" fill-opacity="0.025" transform="skewX(-20)"/>

    <text class="hi fade" x="60" y="70">hello, world. i am</text>
    <text class="name fade d2" x="58" y="132">Dhruv Patel</text>

    <text class="prompt fade d3" x="60" y="190">&gt;</text>
    <g transform="translate(92,166)">
      <g clip-path="url(#c0)"><text class="role" x="0" y="26" textLength="380" lengthAdjust="spacing">Full-stack developer</text></g>
      <g clip-path="url(#c1)"><text class="role" x="0" y="26" textLength="420" lengthAdjust="spacing">React · Node.js · MongoDB</text></g>
      <g clip-path="url(#c2)"><text class="role" x="0" y="26" textLength="400" lengthAdjust="spacing">building the Harvest ERP</text></g>
    </g>

    <text class="sub fade d3" x="60" y="232">BCA @ CHARUSAT  ·  Nadiad, India</text>

    <rect x="0" y="254" width="1000" height="6" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="259" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
